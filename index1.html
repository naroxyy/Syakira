<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulir Pendaftaran Anggota Baru</title>
    <link rel="stylesheet" href="rafa1.css">
</head>
<body>

    <h1>Buatkan halaman web yang berisi Form seperti berikut</h1>
    <hr>

    <div class="container">
        <h2>Formulir Pendaftaran Anggota Baru</h2>

        <form>
            <div class="form-group">
                <label for="nama">Nama Lengkap:</label>
                <input type="text" id="nama" placeholder="Isi nama Anda" required>
            </div>

            <div class="form-group">
                <label for="email">Alamat Email:</label>
                <input type="email" id="email" placeholder="nama@email.com" required>
            </div>

            <div class="form-group">
                <label for="password">Kata Sandi:</label>
                <input type="password" id="password" placeholder="**********" required>
            </div>

            <div class="pilihan">
                <p>Pilih Minat Utama (Satu):</p>

                <label>
                    <input type="radio" name="minat" value="web" checked>
                    Pengembangan Web
                </label>

                <label>
                    <input type="radio" name="minat" value="desain">
                    Desain Grafis
                </label>

                <br>

                <label>
                    <input type="radio" name="minat" value="kriptografi">
                    Kriptografi
                </label>

                <label>
                    <input type="radio" name="minat" value="data">
                    Analisis Data
                </label>
            </div>

            <div class="pilihan">
                <p>Area Keahlian (Pilih semua yang sesuai):</p>

                <label>
                    <input type="checkbox" name="keahlian" value="html">
                    HTML/CSS
                </label>

                <label>
                    <input type="checkbox" name="keahlian" value="javascript" checked>
                    JavaScript/Node.js
                </label>

                <label>
                    <input type="checkbox" name="keahlian" value="python" checked>
                    Python
                </label>

                <br>

                <label>
                    <input type="checkbox" name="keahlian" value="uiux">
                    Desain UI/UX
                </label>

                <label>
                    <input type="checkbox" name="keahlian" value="marketing">
                    Pemasaran Digital
                </label>
            </div>

            <div class="negara">
                <label for="negara">Negara Asal:</label>

                <select id="negara" required>
                    <option value="">Pilih Negara</option>
                    <option value="Indonesia">Indonesia</option>
                    <option value="Malaysia">Malaysia</option>
                    <option value="Singapura">Singapura</option>
                    <option value="Thailand">Thailand</option>
                    <option value="Jepang">Jepang</option>
                </select>
            </div>

            <button type="submit">Daftar Sekarang</button>
        </form>
    </div>

    <footer>
        Kelas X RPL 3 | HTML, CSS, dan JavaScript
    </footer>

</body>
</html>
